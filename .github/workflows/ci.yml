name: CI/CD Seguro (FastAPI + UV)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_DIR: ""
  PYTHON_VERSION: "3.11"
  APP_MODULE: "main:app"
  PORT: "8000"
  HEALTH_PATH: "/"

jobs:
  config:
    name: Detectar projeto
    runs-on: ubuntu-latest
    outputs:
      app_dir: ${{ steps.detectar.outputs.app_dir }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Localizar pyproject.toml
        id: detectar
        run: |
          if [ -n "$APP_DIR" ] && [ -f "$APP_DIR/pyproject.toml" ]; then
            DIR="$APP_DIR"
          else
            DIR=$(find . -maxdepth 3 -name pyproject.toml \
              -not -path "*/.venv/*" -not -path "*/node_modules/*" \
              | sort | head -1 | xargs -r dirname)
          fi
          if [ -z "$DIR" ]; then
            echo "pyproject.toml não encontrado no repositório"
            exit 1
          fi
          echo "Projeto encontrado em: $DIR"
          echo "app_dir=$DIR" >> "$GITHUB_OUTPUT"

  verificar-e-testar:
    name: Lint, tipagem e testes
    needs: config
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ needs.config.outputs.app_dir }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar UV
        uses: astral-sh/setup-uv@v5

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sincronizar dependências
        run: |
          if [ -f uv.lock ]; then
            uv sync --locked
          else
            uv sync
          fi

      #- name: Validar Linting (Ruff)
      #  run: uvx ruff check .

      - name: Validar Tipagem Estática (MyPy)
        run: uv run --with mypy mypy .

      - name: Testar carregamento da aplicação
        run: |
          MODULE="${APP_MODULE%%:*}"
          uv run python -c "import ${MODULE}; print('Aplicação carregada com sucesso via uv!')"

  sast:
    name: Análise SAST (Semgrep)
    needs: verificar-e-testar
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Executar Semgrep
        run: semgrep scan --config auto --sarif --output semgrep.sarif

      - name: Guardar relatório como artefato
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-sarif
          path: semgrep.sarif

      - name: Enviar relatório para o GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif

  dast:
    name: Análise DAST (OWASP ZAP)
    needs: [config, verificar-e-testar, sast]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: ${{ needs.config.outputs.app_dir }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar UV
        uses: astral-sh/setup-uv@v5

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Iniciar API em background
        run: |
          if [ -f uv.lock ]; then
            uv sync --locked
          else
            uv sync
          fi
          uv run --with uvicorn uvicorn "$APP_MODULE" --host 0.0.0.0 --port "$PORT" &
          for i in $(seq 1 30); do
            if curl -s "http://localhost:${PORT}${HEALTH_PATH}" > /dev/null; then
              echo "API no ar!"
              exit 0
            fi
            sleep 1
          done
          echo "API não respondeu a tempo"
          exit 1

      - name: Executar OWASP ZAP Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:${{ env.PORT }}${{ env.HEALTH_PATH }}'
          fail_action: false