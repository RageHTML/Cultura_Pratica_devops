name: FastAPI CI/CD com UV e Segurança

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verificar-e-testar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar UV
        uses: astral-sh/setup-uv@v5

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sincronizar dependências com UV
        run: |
          cd web_server
          uv sync --locked

      - name: Validar Linting (Ruff)
        run: |
          cd web_server
          uv run ruff check .

      - name: Validar Tipagem Estática (MyPy)
        run: |
          cd web_server
          uv run mypy .

      - name: Testar aplicação
        run: |
          cd web_server
          uv run python -c "import main; print('FastAPI carregado com sucesso via uv!')"

  sast:
    name: Análise SAST (Semgrep)
    needs: verificar-e-testar
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Executar Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: auto
          generateSarif: "true"

      - name: Enviar relatório para o GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'semgrep.sarif'

  # 3. Nó de DAST (Análise Dinâmica de Segurança)
  dast:
    name: Análise DAST (OWASP ZAP)
    needs: [verificar-e-testar, sast]
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar UV
        uses: astral-sh/setup-uv@v5

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Iniciar API FastAPI em background
        run: |
          cd web_server
          uv sync --locked
          uv run uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 5

      - name: Executar OWASP ZAP Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:8000/'
          fail_action: false